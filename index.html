<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#061b3a">
<title>Smart Review</title>

<style>
:root{
  --navy:#061b3a;
  --navy2:#08264d;
  --blue:#165dff;
  --gold:#d99213;
  --gold-light:#ffcf55;
  --ink:#071b3c;
  --muted:#65758c;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  min-height:100dvh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#fff;
  color:var(--ink);
}

.app{
  width:100%;
  min-height:100vh;
  background:#fff;
  overflow:hidden;
}

/* HERO */

.hero{
  position:relative;
  min-height:390px;
  padding:35px 18px 95px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  color:#fff;
  background:
    radial-gradient(circle at 50% 5%,rgba(255,255,255,.1),transparent 30%),
    linear-gradient(180deg,#061b3a,#08264d 70%,#092e5c);
}

.google-mark{
  width:100px;
  height:100px;
  border-radius:50%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:20px;
  border:3px solid var(--gold);
  box-shadow:0 15px 34px rgba(0,0,0,.3);
}

.google-letter{
  font-family:Arial,sans-serif;
  font-size:66px;
  font-weight:800;
  background:conic-gradient(
    from -35deg,
    #4285f4 0deg 80deg,
    #34a853 80deg 170deg,
    #fbbc05 170deg 245deg,
    #ea4335 245deg 320deg,
    #4285f4 320deg 360deg
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero-title{
  max-width:600px;
  font-size:clamp(23px,6vw,34px);
  line-height:1.15;
  font-weight:900;
  text-transform:uppercase;
}

.hero-rating{
  margin-top:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.rating-line{
  width:55px;
  height:2px;
  background:#4285ff;
}

.hero-stars{
  display:flex;
  gap:4px;
}

.hero-star{
  font-size:38px;
  color:var(--gold-light);
}

.wave{
  position:absolute;
  bottom:-1px;
  left:-5%;
  width:110%;
  height:100px;
  background:#fff;
  clip-path:ellipse(73% 58% at 50% 100%);
}

/* CONTENT */

.content{
  position:relative;
  z-index:5;
  margin-top:-20px;
  padding:0 18px 40px;
  display:flex;
  flex-direction:column;
  align-items:center;
  background:#fff;
}

.client-brand{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.logo-frame{
  width:190px;
  height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  margin-bottom:20px;
}

.logo-frame::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(var(--gold),var(--gold)) left top/60px 4px no-repeat,
    linear-gradient(var(--gold),var(--gold)) left top/4px 60px no-repeat,
    linear-gradient(var(--gold),var(--gold)) right top/60px 4px no-repeat,
    linear-gradient(var(--gold),var(--gold)) right top/4px 60px no-repeat,
    linear-gradient(var(--gold),var(--gold)) left bottom/60px 4px no-repeat,
    linear-gradient(var(--gold),var(--gold)) left bottom/4px 60px no-repeat,
    linear-gradient(var(--gold),var(--gold)) right bottom/60px 4px no-repeat,
    linear-gradient(var(--gold),var(--gold)) right bottom/4px 60px no-repeat;
}

.client-logo{
  width:140px;
  height:140px;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:linear-gradient(145deg,#fff,#f0f3f7);
  box-shadow:0 15px 35px rgba(7,27,60,.13);
  font-size:52px;
}

.client-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.business-name{
  width:100%;
  font-size:clamp(29px,8vw,42px);
  line-height:1.08;
  font-weight:900;
  color:var(--navy);
  overflow-wrap:anywhere;
}

.subtitle{
  margin-top:8px;
  margin-bottom:28px;
  color:#53657d;
  font-size:18px;
  font-weight:600;
}

/* FEEDBACK */

.feedback-area{
  width:100%;
  max-width:680px;
  text-align:center;
}

.hidden{
  display:none !important;
}

.rating-question{
  font-size:clamp(22px,6vw,30px);
  line-height:1.2;
  font-weight:850;
  margin-bottom:15px;
}

.stars{
  display:flex;
  justify-content:center;
  gap:3px;
}

.star{
  border:0;
  outline:0;
  background:transparent;
  width:clamp(58px,16vw,84px);
  height:clamp(65px,17vw,92px);
  padding:0;
  font-size:clamp(58px,16vw,82px);
  line-height:1;
  color:#c9d0d9;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.star.active{
  color:var(--gold);
  filter:drop-shadow(0 5px 6px rgba(150,90,0,.25));
}

.rating-text{
  min-height:28px;
  margin:4px 0 20px;
  color:var(--muted);
  font-size:16px;
  font-weight:650;
}

.message{
  text-align:center;
}

.message h2{
  color:var(--navy);
  font-size:clamp(23px,6vw,31px);
  margin-bottom:9px;
}

.message p{
  color:#61728a;
  font-size:17px;
  line-height:1.5;
  margin-bottom:20px;
}

.button{
  width:100%;
  min-height:72px;
  border-radius:20px;
  border:none;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  padding:18px 22px;
  font-size:19px;
  font-weight:900;
  cursor:pointer;
  margin-top:10px;
}

.google{
  color:#fff;
  background:linear-gradient(135deg,#0a2d59,#0d407a,#08294f);
  border:2px solid rgba(217,146,19,.88);
  box-shadow:0 12px 28px rgba(7,27,60,.22);
}

.private{
  color:#fff;
  background:linear-gradient(135deg,#123e6d,#09294d);
}

textarea{
  width:100%;
  min-height:150px;
  resize:none;
  padding:18px;
  border-radius:20px;
  border:1.5px solid rgba(7,27,60,.12);
  background:#f6f8fb;
  color:var(--ink);
  outline:none;
  font-size:18px;
  line-height:1.5;
}

.brand-footer{
  width:100%;
  text-align:center;
  margin-top:40px;
  padding-top:22px;
  border-top:1px solid rgba(7,27,60,.11);
}

.smart-review{
  font-size:36px;
  font-weight:950;
  background:linear-gradient(110deg,#a86c08,#e3a51e,#fff,#356a9f,#061b3a);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.smart-review-sub{
  margin-top:7px;
  color:#6b788a;
  font-size:11px;
  font-weight:750;
  letter-spacing:2px;
  text-transform:uppercase;
}

.error{
  color:#d83b3b;
  font-weight:700;
}

.loading{
  color:#65758c;
}

@media(max-width:390px){
  .hero{
    min-height:370px;
    padding-left:14px;
    padding-right:14px;
  }

  .google-mark{
    width:88px;
    height:88px;
  }

  .google-letter{
    font-size:58px;
  }

  .content{
    padding-left:15px;
    padding-right:15px;
  }

  .logo-frame{
    width:155px;
    height:155px;
  }

  .client-logo{
    width:110px;
    height:110px;
  }
}
</style>
</head>

<body>

<div class="app">

<section class="hero">

  <div class="google-mark">
    <div class="google-letter">G</div>
  </div>

  <h1 class="hero-title">
    LAISSEZ-NOUS VOTRE AVIS SUR GOOGLE
  </h1>

  <div class="hero-rating">
    <div class="rating-line"></div>

    <div class="hero-stars">
      <span class="hero-star">★</span>
      <span class="hero-star">★</span>
      <span class="hero-star">★</span>
      <span class="hero-star">★</span>
      <span class="hero-star">★</span>
    </div>

    <div class="rating-line"></div>
  </div>

  <div class="wave"></div>

</section>

<main class="content">

<section class="client-brand">

  <div class="logo-frame">
    <div class="client-logo" id="logo">
      🍽️
    </div>
  </div>

  <h2 class="business-name" id="businessName">
    Chargement...
  </h2>

  <p class="subtitle" id="subtitle">
    Connexion à Smart Review...
  </p>

</section>

<section id="feedbackArea" class="feedback-area hidden">

  <div class="rating-question">
    Comment avez-vous vécu votre expérience ?
  </div>

  <div
    class="stars"
    id="stars"
    role="radiogroup"
    aria-label="Évaluez votre expérience"
  >

    <button class="star" type="button" data-rating="1">★</button>
    <button class="star" type="button" data-rating="2">★</button>
    <button class="star" type="button" data-rating="3">★</button>
    <button class="star" type="button" data-rating="4">★</button>
    <button class="star" type="button" data-rating="5">★</button>

  </div>

  <div class="rating-text" id="ratingText">
    Touchez une étoile pour commencer
  </div>

  <section class="message hidden" id="message">

    <h2 id="messageTitle"></h2>

    <p id="messageText"></p>

    <div id="googleArea" class="hidden">

      <a
        id="googleButton"
        class="button google"
        href="#"
        target="_blank"
        rel="noopener"
      >
        ⭐ Écrire mon avis sur Google
      </a>

    </div>

    <div id="privateArea" class="hidden">

      <textarea
        id="feedbackMessage"
        placeholder="Dites-nous ce qui s'est passé ou comment nous pouvons nous améliorer..."
      ></textarea>

      <button
        type="button"
        id="sendPrivate"
        class="button private"
      >
        💬 Envoyer mon retour
      </button>

    </div>

  </section>

</section>

<footer class="brand-footer">

  <div class="smart-review">
    Smart Review
  </div>

  <div class="smart-review-sub">
    Better feedback. Better businesses.
  </div>

</footer>

</main>

</div>

<script>
/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://ptfijeyhgmtcsedyiwto.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_gtihO7sbuhLIOG7ausRhXg_sYupQjXZ";


/* =====================================================
   HELPERS
===================================================== */

function getCardCode(){

  const params =
    new URLSearchParams(window.location.search);

  return params.get("card");
}


async function supabaseGet(endpoint){

  const response =
    await fetch(
      SUPABASE_URL + "/rest/v1/" + endpoint,
      {
        method:"GET",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json"
        }
      }
    );

  const text =
    await response.text();

  if(!response.ok){
    throw new Error(
      "Supabase HTTP " +
      response.status +
      ": " +
      text
    );
  }

  return text ? JSON.parse(text) : [];
}


/* =====================================================
   ELEMENTS
===================================================== */

const businessName =
  document.getElementById("businessName");

const subtitle =
  document.getElementById("subtitle");

const feedbackArea =
  document.getElementById("feedbackArea");

const logo =
  document.getElementById("logo");

const stars =
  document.querySelectorAll(".star");

const ratingText =
  document.getElementById("ratingText");

const message =
  document.getElementById("message");

const messageTitle =
  document.getElementById("messageTitle");

const messageText =
  document.getElementById("messageText");

const googleArea =
  document.getElementById("googleArea");

const privateArea =
  document.getElementById("privateArea");

const googleButton =
  document.getElementById("googleButton");

const feedbackMessage =
  document.getElementById("feedbackMessage");

let currentBusiness = null;
let selectedRating = null;


/* =====================================================
   LOAD CARD
===================================================== */

async function loadCard(){

  const cardCode = getCardCode();

  console.log("Smart Review card:", cardCode);

  if(!cardCode){

    businessName.textContent =
      "Carte introuvable";

    subtitle.innerHTML =
      '<span class="error">Aucun code de carte n’a été fourni.</span>';

    return;
  }

  try{

    const cards =
      await supabaseGet(
        "cards?card_code=eq." +
        encodeURIComponent(cardCode) +
        "&active=eq.true&select=*"
      );

    console.log("Cards:", cards);

    if(!cards.length){
      throw new Error(
        "Aucune carte active trouvée pour " +
        cardCode
      );
    }

    const card = cards[0];

    const businesses =
      await supabaseGet(
        "businesses?id=eq." +
        encodeURIComponent(card.business_id) +
        "&select=*"
      );

    console.log("Businesses:", businesses);

    if(!businesses.length){
      throw new Error(
        "Aucun établissement trouvé pour business_id " +
        card.business_id
      );
    }

    currentBusiness = businesses[0];

    businessName.textContent =
      currentBusiness.name ||
      "Votre établissement";

    subtitle.textContent =
      "Votre opinion compte pour nous.";

    document.title =
      (currentBusiness.name || "Smart Review") +
      " — Smart Review";

    if(currentBusiness.logo_url){

      const image =
        document.createElement("img");

      image.src =
        currentBusiness.logo_url;

      image.alt =
        currentBusiness.name || "Logo";

      image.onerror =
        function(){
          logo.innerHTML = "🍽️";
        };

      logo.innerHTML = "";
      logo.appendChild(image);
    }

    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";

    feedbackArea.classList.remove("hidden");

  }
  catch(error){

    console.error(
      "SMART REVIEW ERROR:",
      error
    );

    businessName.textContent =
      "Carte introuvable";

    subtitle.innerHTML =
      '<span class="error">' +
      "Cette carte est inactive ou n’existe pas." +
      "</span>";

  }
}


/* =====================================================
   RATINGS
===================================================== */

stars.forEach(function(star){

  star.addEventListener("click",function(){

    selectedRating =
      Number(star.dataset.rating);

    stars.forEach(function(s){

      s.classList.toggle(
        "active",
        Number(s.dataset.rating) <= selectedRating
      );

    });

    const labels = {
      1:"Nous aimerions faire mieux.",
      2:"Merci de nous l'avoir signalé.",
      3:"Merci pour votre retour.",
      4:"Ravi de l'entendre !",
      5:"Incroyable ! Merci beaucoup !"
    };

    ratingText.textContent =
      labels[selectedRating];

    message.classList.remove("hidden");

    if(selectedRating <= 2){

      messageTitle.textContent =
        "Nous sommes désolés pour votre expérience.";

      messageText.textContent =
        "Dites-nous ce qui s'est passé. Votre retour nous permet de nous améliorer.";

      googleArea.classList.add("hidden");
      privateArea.classList.remove("hidden");

      feedbackMessage.value = "";

    }else{

      privateArea.classList.add("hidden");
      googleArea.classList.remove("hidden");

      if(selectedRating === 3){

        messageTitle.textContent =
          "Merci pour votre retour !";

      }else if(selectedRating === 4){

        messageTitle.textContent =
          "Nous sommes ravis !";

      }else{

        messageTitle.textContent =
          "Merci ! Nous sommes ravis que vous ayez adoré ! ❤️";

      }

      messageText.textContent =
        "Votre avis peut aider d'autres clients. Nous apprécierions beaucoup votre avis sur Google.";
    }

  });

});


/* =====================================================
   WHATSAPP
===================================================== */

document
  .getElementById("sendPrivate")
  .addEventListener("click",function(){

    if(!currentBusiness){

      alert(
        "Les informations de l'établissement sont indisponibles."
      );

      return;
    }

    if(!currentBusiness.whatsapp_number){

      alert(
        "Le numéro WhatsApp n'est pas configuré."
      );

      return;
    }

    let number =
      String(currentBusiness.whatsapp_number)
      .replace(/\D/g,"");

    if(number.startsWith("0")){

      number =
        "213" +
        number.substring(1);
    }

    const text =
      feedbackMessage.value.trim();

    let whatsappMessage =
      "🔒 Retour privé — " +
      (currentBusiness.name || "Business") +
      "\n\n" +
      "⭐ Note : " +
      selectedRating +
      "/5";

    if(text){

      whatsappMessage +=
        "\n\n💬 Commentaire du client :\n" +
        text;
    }

    const url =
      "https://wa.me/" +
      number +
      "?text=" +
      encodeURIComponent(whatsappMessage);

    window.location.href = url;

  });


/* =====================================================
   START
===================================================== */

loadCard();
</script>

</body>
</html>
