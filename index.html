<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061b3a">
<title>Smart Review</title>

<style>
:root{
  --navy:#061b3a;
  --navy2:#08264d;
  --blue:#165dff;
  --gold:#d99213;
  --gold-light:#ffcf55;
  --white:#fff;
  --muted:#65758c;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#fff;
  color:var(--navy);
  overflow-x:hidden;
}

.app{
  min-height:100vh;
  background:#fff;
}

/* =========================
   HERO
========================= */

.hero{
  position:relative;
  min-height:405px;
  padding:30px 18px 100px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  color:#fff;
  background:
    radial-gradient(circle at 50% 5%,rgba(255,255,255,.10),transparent 30%),
    linear-gradient(180deg,#061b3a 0%,#08264d 70%,#092e5c 100%);
  overflow:hidden;
}

.google-mark{
  position:relative;
  z-index:2;
  width:105px;
  height:105px;
  border-radius:50%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:20px;
  box-shadow:
    0 15px 34px rgba(0,0,0,.30),
    0 0 0 3px rgba(217,146,19,.95);
}

.google-letter{
  font-family:Arial,sans-serif;
  font-size:68px;
  font-weight:800;
  line-height:1;
  background:conic-gradient(
    from -35deg,
    #4285f4 0deg 80deg,
    #34a853 80deg 170deg,
    #fbbc05 170deg 245deg,
    #ea4335 245deg 320deg,
    #4285f4 320deg 360deg
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero-title{
  position:relative;
  z-index:2;
  max-width:560px;
  font-size:clamp(23px,6.3vw,34px);
  line-height:1.13;
  font-weight:900;
  text-transform:uppercase;
}

.hero-rating{
  position:relative;
  z-index:2;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:25px;
}

.rating-line{
  width:clamp(25px,11vw,85px);
  height:2px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(38,129,255,.95)
  );
}

.rating-line.right{
  background:linear-gradient(
    90deg,
    rgba(38,129,255,.95),
    transparent
  );
}

.hero-stars{
  display:flex;
  gap:4px;
}

.hero-star{
  font-size:clamp(30px,8vw,49px);
  color:var(--gold-light);
  text-shadow:0 4px 5px rgba(0,0,0,.45);
}

.wave-blue{
  position:absolute;
  z-index:3;
  left:-5%;
  bottom:55px;
  width:110%;
  height:65px;
  background:linear-gradient(180deg,#0c63ff,#164fd1);
  clip-path:ellipse(69% 55% at 50% 100%);
}

.wave{
  position:absolute;
  z-index:4;
  left:-5%;
  bottom:-1px;
  width:110%;
  height:105px;
  background:#fff;
  clip-path:ellipse(73% 58% at 50% 100%);
}

/* =========================
   CONTENT
========================= */

.content{
  position:relative;
  z-index:10;
  background:#fff;
  margin-top:-23px;
  padding:0 18px 35px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.client-brand{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.logo-frame{
  width:190px;
  height:190px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:18px;
}

.logo-frame::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(var(--gold),var(--gold)) left top / 64px 4px no-repeat,
    linear-gradient(var(--gold),var(--gold)) left top / 4px 64px no-repeat,
    linear-gradient(var(--gold),var(--gold)) right top / 64px 4px no-repeat,
    linear-gradient(var(--gold),var(--gold)) right top / 4px 64px no-repeat,
    linear-gradient(var(--gold),var(--gold)) left bottom / 64px 4px no-repeat,
    linear-gradient(var(--gold),var(--gold)) left bottom / 4px 64px no-repeat,
    linear-gradient(var(--gold),var(--gold)) right bottom / 64px 4px no-repeat,
    linear-gradient(var(--gold),var(--gold)) right bottom / 4px 64px no-repeat;
}

.client-logo{
  width:145px;
  height:145px;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:linear-gradient(145deg,#fff,#f0f3f7);
  box-shadow:0 15px 35px rgba(7,27,60,.13);
  font-size:52px;
}

.client-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.business-name{
  width:100%;
  max-width:700px;
  font-size:clamp(29px,8vw,42px);
  line-height:1.08;
  font-weight:900;
  text-align:center;
  margin-bottom:8px;
  overflow-wrap:anywhere;
}

.subtitle{
  width:100%;
  max-width:600px;
  color:#53657d;
  font-size:clamp(16px,4.5vw,20px);
  font-weight:600;
  text-align:center;
  line-height:1.45;
  margin-bottom:28px;
}

/* =========================
   RATING
========================= */

.feedback-area{
  width:100%;
  max-width:680px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.rating-question{
  width:100%;
  font-size:clamp(22px,6vw,30px);
  line-height:1.18;
  font-weight:850;
  margin-bottom:18px;
}

.stars{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:4px;
  margin-bottom:8px;
}

.star{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  outline:0;
  background:transparent;
  box-shadow:none;
  width:clamp(58px,16vw,84px);
  height:clamp(65px,17vw,92px);
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(58px,16vw,82px);
  line-height:1;
  color:#c9d0d9;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

.star:focus,
.star:focus-visible,
.star:active{
  outline:none;
  border:0;
  background:transparent;
  box-shadow:none;
}

.star.active{
  color:var(--gold);
  filter:drop-shadow(0 5px 6px rgba(150,90,0,.25));
}

.rating-text{
  min-height:28px;
  color:var(--muted);
  font-size:16px;
  font-weight:650;
  margin-bottom:19px;
}

/* =========================
   MESSAGE
========================= */

.message{
  width:100%;
}

.message.hidden{
  display:none;
}

.message h2{
  font-size:clamp(23px,6vw,31px);
  line-height:1.18;
  font-weight:900;
  margin-bottom:9px;
}

.message p{
  color:#61728a;
  font-size:clamp(16px,4.4vw,19px);
  line-height:1.52;
  max-width:620px;
  margin:0 auto 20px;
}

/* =========================
   BUTTONS
========================= */

.button{
  width:100%;
  min-height:72px;
  border-radius:20px;
  border:none;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  padding:18px 22px;
  font-size:clamp(18px,4.8vw,22px);
  font-weight:900;
  cursor:pointer;
  margin-top:10px;
  touch-action:manipulation;
}

.google{
  color:#fff;
  background:linear-gradient(
    135deg,
    #0a2d59,
    #0d407a,
    #08294f
  );
  border:2px solid rgba(217,146,19,.88);
  box-shadow:0 12px 28px rgba(7,27,60,.22);
}

.private{
  color:#fff;
  background:linear-gradient(
    135deg,
    #123e6d,
    #09294d
  );
  box-shadow:0 11px 26px rgba(7,27,60,.18);
}

.private.sending{
  background:#168a46;
  pointer-events:none;
}

textarea{
  width:100%;
  min-height:150px;
  resize:none;
  padding:18px;
  border-radius:20px;
  border:1.5px solid rgba(7,27,60,.12);
  background:#f6f8fb;
  color:var(--navy);
  outline:none;
  font-size:18px;
  line-height:1.5;
}

textarea:focus{
  border-color:rgba(22,93,255,.55);
}

/* =========================
   FOOTER
========================= */

.brand-footer{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-top:38px;
  padding-top:23px;
  border-top:1px solid rgba(7,27,60,.11);
}

.brand-mini-line{
  width:150px;
  height:3px;
  margin-bottom:14px;
  border-radius:20px;
  background:linear-gradient(
    90deg,
    transparent,
    var(--gold),
    var(--blue),
    transparent
  );
}

.smart-review{
  font-size:clamp(31px,8.5vw,45px);
  font-weight:950;
  letter-spacing:-1.5px;
  color:var(--navy);
}

.smart-review-sub{
  margin-top:8px;
  color:#6b788a;
  font-size:11px;
  font-weight:750;
  letter-spacing:2px;
  text-transform:uppercase;
}

.hidden{
  display:none !important;
}

.error{
  color:#d83b3b !important;
  font-weight:700;
}
</style>
</head>

<body>

<div class="app">

<section class="hero">

  <div class="google-mark">
    <div class="google-letter">G</div>
  </div>

  <h1 class="hero-title">
    LAISSEZ-NOUS VOTRE AVIS SUR GOOGLE
  </h1>

  <div class="hero-rating">
    <div class="rating-line"></div>

    <div class="hero-stars">
      <span class="hero-star">★</span>
      <span class="hero-star">★</span>
      <span class="hero-star">★</span>
      <span class="hero-star">★</span>
      <span class="hero-star">★</span>
    </div>

    <div class="rating-line right"></div>
  </div>

</section>

<main class="content">

<section class="client-brand">

      id="logo"
    >
      🍽️
    </div>

  </div>

  <h2
    class="business-name"

  >
    Chargement...
  </h2>

  <p
    class="subtitle"
    id="subtitle"
  >
    Chargement...
  </p>

<section
  id="feedbackArea"
  class="hidden feedback-area"
>

  <div class="rating-question">
    Comment avez-vous vécu votre expérience ?
  </div>

  <div
    class="stars"
    id="stars"
    role="radiogroup"
    aria-label="Évaluez votre expérience"
  >

    <button
      type="button"
      class="star"
      data-rating="1"
      aria-label="1 étoile"
    >★</button>

    <button
      type="button"
      class="star"
      data-rating="2"
      aria-label="2 étoiles"
    >★</button>

    <button
      type="button"
      class="star"
      data-rating="3"
      aria-label="3 étoiles"
    >★</button>

    <button
      type="button"
      class="star"
      data-rating="4"
      aria-label="4 étoiles"
    >★</button>

    <button
      type="button"
      class="star"
      data-rating="5"
      aria-label="5 étoiles"
    >★</button>

  </div>

  <div
    class="rating-text"
    id="ratingText"
  >
    Touchez une étoile pour commencer
  </div>

  <section
    class="message hidden"
    id="message"
  >

    <h2 id="messageTitle"></h2>

    <div
      id="googleArea"

      <a
        id="googleButton"
        class="button google"

<footer class="brand-footer">

  <div class="brand-mini-line"></div>

    Smart Review
  </div>

  <div class="smart-review-sub">
    Better feedback. Better businesses.
  </div>

</footer>

</main>

</div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://ptfijeyhgmtcsedyiwto.supabase.co";

const SUPABASE_KEY =
"sb_publishable_gtihO7sbuhLIOG7ausRhXg_sYupQjXZ";


/* =========================================================
   CARD CODE
========================================================= */

function getCardCode(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("card");

}


/* =========================================================
   SUPABASE GET
========================================================= */

async function supabaseGet(endpoint){

  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/" +
      endpoint,
      {
        method:"GET",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY,
          "Content-Type":
            "application/json"
        }
      }
    );

  const text =
    await response.text();

  if(!response.ok){

    throw new Error(
      "Supabase HTTP " +
      response.status +
      ": " +
      text
    );

  }

  return text
    ? JSON.parse(text)
    : [];

}


/* =========================================================
   SCAN
========================================================= */

async function trackScan(cardCode){

  if(!cardCode){
    return;
  }

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/report_card_scan",
        {
          method:"POST",
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY,
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            p_card_code:cardCode
          })
        }
      );

    if(!response.ok){

      console.error(
        "Scan tracking failed:",
        await response.text()
      );

      return;

    }

    console.log(
      "Scan recorded:",
      cardCode
    );

  }catch(error){

    console.error(
      "Scan error:",
      error
    );

  }

}


/* =========================================================
   FINAL RATING
   ONLY CALLED WHEN USER SUBMITS.
========================================================= */

async function trackRating(
  cardCode,
  rating
){

  console.log(
    "FINAL RATING SUBMISSION:",
    rating
  );

  if(
    !cardCode ||
    !rating
  ){

    return false;

  }

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/report_card_rating",
        {
          method:"POST",
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY,
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            p_card_code:cardCode,
            p_rating:rating
          })
        }
      );

    if(!response.ok){

      console.error(
        "Rating tracking failed:",
        await response.text()
      );

      return false;

    }

    console.log(
      "FINAL RATING RECORDED:",
      rating
    );

    return true;

  }catch(error){

    console.error(
      "Rating error:",
      error
    );

    return false;

  }

}


/* =========================================================
   STATE
========================================================= */

let currentBusiness = null;
let selectedRating = null;


/* =========================================================
   LOAD CARD
========================================================= */

async function loadCard(){

  const cardCode =
    getCardCode();

  const businessName =
    document.getElementById(
      "businessName"
    );

  const subtitle =
    document.getElementById(
      "subtitle"
    );

  const feedbackArea =
    document.getElementById(
      "feedbackArea"
    );


  if(!cardCode){

    businessName.textContent =
      "Carte introuvable";

    subtitle.innerHTML =
      '<span class="error">Aucun code de carte fourni.</span>';

    return;

  }


  try{

    const cards =
      await supabaseGet(
        "cards?card_code=eq." +
        encodeURIComponent(cardCode) +
        "&active=eq.true&select=*"
      );


    if(!cards.length){

      throw new Error(
        "Card not found"
      );

    }


    const card =
      cards[0];


    const businesses =
      await supabaseGet(
        "businesses?id=eq." +
        encodeURIComponent(
          card.business_id
        ) +
        "&select=*"
      );


    if(!businesses.length){

      throw new Error(
        "Business not found"
      );

    }


    currentBusiness =
      businesses[0];


    businessName.textContent =
      currentBusiness.name ||
      "Votre établissement";


    subtitle.textContent =
      "Votre opinion compte pour nous.";


    document.title =
      (
        currentBusiness.name ||
        "Smart Review"
      ) +
      " — Smart Review";


    if(
      currentBusiness.logo_url
    ){

      const logo =
        document.getElementById(
          "logo"
        );

      logo.innerHTML = "";

      const image =
        document.createElement(
          "img"
        );

      image.src =
        currentBusiness.logo_url;

      image.alt =
        currentBusiness.name ||
        "Logo";

      image.onerror =
        function(){

          logo.innerHTML =
            "🍽️";

        };

      logo.appendChild(
        image
      );

    }


    const googleButton =
      document.getElementById(
        "googleButton"
      );

    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";


    feedbackArea
      .classList
      .remove("hidden");


  }catch(error){

    console.error(
      "Card loading error:",
      error
    );

    businessName.textContent =
      "Carte introuvable";

    subtitle.innerHTML =
      '<span class="error">Cette carte est inactive ou n’existe pas.</span>';

  }

}


/* =========================================================
   ELEMENTS
========================================================= */

const stars =
  document.querySelectorAll(
    ".star"
  );

const ratingText =
  document.getElementById(
    "ratingText"
  );

const message =
  document.getElementById(
    "message"
  );

const messageTitle =
  document.getElementById(
    "messageTitle"
  );

const messageText =
  document.getElementById(
    "messageText"
  );

const googleArea =
  document.getElementById(
    "googleArea"
  );

const privateArea =
  document.getElementById(
    "privateArea"
  );

const feedbackMessage =
  document.getElementById(
    "feedbackMessage"
  );

const sendPrivate =
  document.getElementById(
    "sendPrivate"
  );

const googleButton =
  document.getElementById(
    "googleButton"
  );


/* =========================================================
   STAR CLICK
   NO DATABASE CALL.
========================================================= */

stars.forEach(
  star => {

    star.addEventListener(
      "click",
      function(){

        const rating =
          Number(
            this.dataset.rating
          );


        selectedRating =
          rating;


        console.log(
          "Star selected locally:",
          selectedRating
        );


        stars.forEach(
          item => {

            const itemRating =
              Number(
                item.dataset.rating
              );

            item.classList.toggle(
              "active",
              itemRating <=
              selectedRating
            );

          }
        );


        const labels = {

          1:
          "Nous aimerions faire mieux.",

          2:
          "Merci de nous l'avoir signalé.",

          3:
          "Merci pour votre retour.",

          4:
          "Ravi de l'entendre !",

          5:
          "Incroyable ! Merci beaucoup !"

        };


        ratingText.textContent =
          labels[selectedRating];


        message
          .classList
          .remove("hidden");


        if(
          selectedRating <= 2
        ){

          messageTitle.textContent =
            "Nous sommes désolés pour votre expérience.";

          messageText.textContent =
            "Dites-nous ce qui s'est passé. Votre retour nous permet de nous améliorer.";

          googleArea
            .classList
            .add("hidden");

          privateArea
            .classList
            .remove("hidden");

        }else{

          privateArea
            .classList
            .add("hidden");

          googleArea
            .classList
            .remove("hidden");


          if(
            selectedRating === 3
          ){

            messageTitle.textContent =
              "Merci pour votre retour !";

          }else if(
            selectedRating === 4
          ){

            messageTitle.textContent =
              "Nous sommes ravis !";

          }else{

            messageTitle.textContent =
              "Merci ! Nous sommes ravis que vous ayez adoré ! ❤️";

          }


          messageText.textContent =
            "Votre avis peut aider d'autres clients. Nous apprécierions beaucoup votre avis sur Google.";

        }

      }
    );

  }
);


/* =========================================================
   WHATSAPP SUBMISSION
========================================================= */

sendPrivate.addEventListener(
  "click",
  async function(){

    if(
      !selectedRating ||
      selectedRating > 2
    ){

      alert(
        "Veuillez sélectionner 1 ou 2 étoiles."
      );

      return;

    }


    if(
      !currentBusiness
    ){

      alert(
        "Établissement indisponible."
      );

      return;

    }


    if(
      !currentBusiness.whatsapp_number
    ){

      alert(
        "Le numéro WhatsApp n'est pas configuré."
      );

      return;

    }


    if(
      sendPrivate.dataset.submitting ===
      "true"
    ){

      return;

    }


    sendPrivate.dataset.submitting =
      "true";

    sendPrivate.classList.add(
      "sending"
    );

    sendPrivate.textContent =
      "Envoi en cours...";


    const finalRating =
      selectedRating;


    /* Record final rating ONLY NOW */

    await trackRating(
      getCardCode(),
      finalRating
    );


    /* =========================
       CLEAN WHATSAPP NUMBER
    ========================= */

    let number =
      String(
        currentBusiness.whatsapp_number
      )
      .trim()
      .replace(
        /\D/g,
        ""
      );


    /* =========================
       BUILD MESSAGE
    ========================= */

    let whatsappMessage =
      "🔒 Retour privé — " +
      (
        currentBusiness.name ||
        "Business"
      ) +
      "\n\n" +
      "⭐ Note : " +
      finalRating +
      "/5";


    const comment =
      feedbackMessage
        .value
        .trim();


    if(comment){

      whatsappMessage +=
        "\n\n💬 Commentaire du client :\n" +
        comment;

    }


    /* =========================
       WHATSAPP SEND URL
    ========================= */

    const whatsappURL =
      "https://api.whatsapp.com/send?phone=" +
      number +
      "&text=" +
      encodeURIComponent(
        whatsappMessage
      );


    console.log(
      "Opening WhatsApp:",
      whatsappURL
    );


    window.location.href =
      whatsappURL;

  }
);


/* =========================================================
   GOOGLE SUBMISSION
========================================================= */

googleButton.addEventListener(
  "click",
  async function(event){

    if(
      !selectedRating ||
      selectedRating < 3
    ){

      event.preventDefault();

      alert(
        "Veuillez sélectionner une note de 3 à 5 étoiles."
      );

      return;

    }


    if(
      googleButton.dataset.submitting ===
      "true"
    ){

      event.preventDefault();

      return;

    }


    googleButton.dataset.submitting =
      "true";


    const finalRating =
      selectedRating;


    await trackRating(
      getCardCode(),
      finalRating
    );

  }
);
