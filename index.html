<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061b3a">
<title>Avify Stat</title>

<style>
:root{
  --navy:#061b3a;
  --navy2:#08264d;
  --blue:#165dff;
  --gold:#d99213;
  --gold-light:#ffcf55;
  --white:#fff;
  --muted:#65758c;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#fff;
  color:var(--navy);
  overflow-x:hidden;
}

.app{
  min-height:100vh;
  background:#fff;
}

/* =========================
   HERO
========================= */

.hero{
  position:relative;
  min-height:405px;
  padding:30px 18px 68px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  color:#fff;
  background:
    radial-gradient(circle at 50% 5%,rgba(255,255,255,.10),transparent 30%),
    linear-gradient(180deg,#061b3a 0%,#08264d 70%,#092e5c 100%);
  overflow:hidden;
}

.google-mark{
  position:relative;
  z-index:2;
  width:105px;
  height:105px;
  border-radius:50%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:20px;
  box-shadow:
    0 15px 34px rgba(0,0,0,.30),
    0 0 0 3px rgba(217,146,19,.95);
}

.google-letter{
  font-family:Arial,sans-serif;
  font-size:68px;
  font-weight:800;
  line-height:1;
  background:conic-gradient(
    from -35deg,
    #4285f4 0deg 80deg,
    #34a853 80deg 170deg,
    #fbbc05 170deg 245deg,
    #ea4335 245deg 320deg,
    #4285f4 320deg 360deg
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero-title{
  position:relative;
  z-index:2;
  max-width:560px;
  font-size:clamp(23px,6.3vw,34px);
  line-height:1.13;
  font-weight:900;
  text-transform:uppercase;
}

.hero-rating{
  position:relative;
  z-index:2;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:25px;
}

.rating-line{
  width:clamp(25px,11vw,85px);
  height:2px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(38,129,255,.95)
  );
}

.rating-line.right{
  background:linear-gradient(
    90deg,
    rgba(38,129,255,.95),
    transparent
  );
}

.hero-stars{
  display:flex;
  gap:4px;
}

.hero-star{
  font-size:clamp(30px,8vw,49px);
  color:var(--gold-light);
  text-shadow:0 4px 5px rgba(0,0,0,.45);
}

.wave-blue{
  position:absolute;
  z-index:3;
  left:-5%;
  bottom:25px;
  width:110%;
  height:32px;
  background:linear-gradient(180deg,#0c63ff,#164fd1);
  clip-path:ellipse(69% 55% at 50% 100%);
}

.wave{
  position:absolute;
  z-index:4;
  left:-5%;
  bottom:-1px;
  width:110%;
  height:105px;
  background:#fff;
  clip-path:ellipse(73% 58% at 50% 100%);
}

/* =========================
   CONTENT
========================= */

.content{
  position:relative;
  z-index:10;
  background:#fff;
  margin-top:-23px;
  padding:0 18px 35px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.client-brand{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.logo-frame{
  width:190px;
  height:190px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:18px;
}

.logo-frame::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(var(--gold),var(--gold)) left top / 64px 4px no-repeat,
    linear-gradient(var(--gold),var(--gold)) left top / 4px 64px no-repeat,
    linear-gradient(var(--gold),var(--gold)) right top / 64px 4px no-repeat,
    linear-gradient(var(--gold),var(--gold)) right top / 4px 64px no-repeat,
    linear-gradient(var(--gold),var(--gold)) left bottom / 64px 4px no-repeat,
    linear-gradient(var(--gold),var(--gold)) left bottom / 4px 64px no-repeat,
    linear-gradient(var(--gold),var(--gold)) right bottom / 64px 4px no-repeat,
    linear-gradient(var(--gold),var(--gold)) right bottom / 4px 64px no-repeat;
}

.client-logo{
  width:145px;
  height:145px;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:linear-gradient(145deg,#fff,#f0f3f7);
  box-shadow:0 15px 35px rgba(7,27,60,.13);
  font-size:52px;
}

.client-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.business-name{
  width:100%;
  max-width:700px;
  font-size:clamp(29px,8vw,42px);
  line-height:1.08;
  font-weight:900;
  text-align:center;
  margin-bottom:8px;
  overflow-wrap:anywhere;
}

.subtitle{
  width:100%;
  max-width:600px;
  color:#53657d;
  font-size:clamp(16px,4.5vw,20px);
  font-weight:600;
  text-align:center;
  line-height:1.45;
  margin-bottom:28px;
}

/* =========================
   RATING
========================= */

.feedback-area{
  width:100%;
  max-width:680px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.rating-question{
  width:100%;
  font-size:clamp(22px,6vw,30px);
  line-height:1.18;
  font-weight:850;
  margin-bottom:18px;
}

.stars{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:4px;
  margin-bottom:8px;
}

.star{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  outline:0;
  background:transparent;
  box-shadow:none;
  width:clamp(58px,16vw,84px);
  height:clamp(65px,17vw,92px);
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(58px,16vw,82px);
  line-height:1;
  color:#c9d0d9;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

.star:focus,
.star:focus-visible,
.star:active{
  outline:none;
  border:0;
  background:transparent;
  box-shadow:none;
}

.star.active{
  color:var(--gold);
  filter:drop-shadow(0 5px 6px rgba(150,90,0,.25));
}

.rating-text{
  min-height:28px;
  color:var(--muted);
  font-size:16px;
  font-weight:650;
  margin-bottom:19px;
}

/* =========================
   MESSAGE
========================= */

.message{
  width:100%;
}

.message.hidden{
  display:none;
}

.message h2{
  font-size:clamp(23px,6vw,31px);
  line-height:1.18;
  font-weight:900;
  margin-bottom:9px;
}

.message p{
  color:#61728a;
  font-size:clamp(16px,4.4vw,19px);
  line-height:1.52;
  max-width:620px;
  margin:0 auto 20px;
}

/* =========================
   BUTTONS
========================= */

.button{
  width:100%;
  min-height:72px;
  border-radius:20px;
  border:none;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  padding:18px 22px;
  font-size:clamp(18px,4.8vw,22px);
  font-weight:900;
  cursor:pointer;
  margin-top:10px;
  touch-action:manipulation;
}

.google{
  color:#fff;
  background:linear-gradient(
    135deg,
    #0a2d59,
    #0d407a,
    #08294f
  );
  border:2px solid rgba(217,146,19,.88);
  box-shadow:0 12px 28px rgba(7,27,60,.22);
}

.private{
  color:#fff;
  background:linear-gradient(
    135deg,
    #123e6d,
    #09294d
  );
  box-shadow:0 11px 26px rgba(7,27,60,.18);
}

.private.sending{
  background:#168a46;
  pointer-events:none;
}

textarea{
  width:100%;
  min-height:150px;
  resize:none;
  padding:18px;
  border-radius:20px;
  border:1.5px solid rgba(7,27,60,.12);
  background:#f6f8fb;
  color:var(--navy);
  outline:none;
  font-size:18px;
  line-height:1.5;
}

textarea:focus{
  border-color:rgba(22,93,255,.55);
}

/* =========================
   FOOTER
========================= */

.brand-footer{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-top:38px;
  padding-top:23px;
  border-top:1px solid rgba(7,27,60,.11);
}

.brand-mini-line{
  width:150px;
  height:3px;
  margin-bottom:14px;
  border-radius:20px;
  background:linear-gradient(
    90deg,
    transparent,
    var(--gold),
    var(--blue),
    transparent
  );
}

.smart-review{
  font-size:clamp(31px,8.5vw,45px);
  font-weight:950;
  letter-spacing:-1.5px;
  color:var(--navy);
}

.smart-review-sub{
  margin-top:8px;
  color:#6b788a;
  font-size:11px;
  font-weight:750;
  letter-spacing:2px;
  text-transform:uppercase;
}

.hidden{
  display:none !important;
}

.error{
  color:#d83b3b !important;
  font-weight:700;
}

/* =========================
   INTERACTIVE RATING FACE
   (replaces the static logo/photo)
========================= */

.logo-ring-wrap{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.rating-ring{
  width:118px;
  height:118px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:340px;
  cursor:pointer;
}

.rating-ring .ring-svg{
  position:absolute;
  inset:0;
  transform:rotate(-90deg);
}

.rating-ring .track{
  stroke:rgba(7,27,60,.12);
}

.rating-ring .fill{
  stroke:url(#faceGoldGrad);
  stroke-linecap:round;
  stroke-dasharray:377;
  stroke-dashoffset:377;
  transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1);
}

.face-tilt{
  transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.2,.8,.2,1);
  will-change:transform;
}

.face-wrap{
  width:88px;
  height:88px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  transform:scale(.4);
}

.face-wrap.shown{ opacity:1; transform:scale(1); }

.face-wrap.pop{ animation:faceCirclePop .5s cubic-bezier(.34,1.56,.64,1); }
@keyframes faceCirclePop{
  0%{ transform:scale(.8,.8); }
  35%{ transform:scale(1.18,.86); }
  55%{ transform:scale(.94,1.1); }
  75%{ transform:scale(1.05,.97); }
  100%{ transform:scale(1,1); }
}

.face-wrap.greet{ animation:faceGreet .9s cubic-bezier(.34,1.56,.64,1); }
@keyframes faceGreet{
  0%{ opacity:0; transform:scale(.3) rotate(0deg); }
  45%{ opacity:1; transform:scale(1.1) rotate(-9deg); }
  65%{ transform:scale(1) rotate(7deg); }
  82%{ transform:scale(1) rotate(-4deg); }
  100%{ transform:scale(1) rotate(0deg); }
}

.face-wrap.waiting{ animation:faceBreathe 3.4s ease-in-out infinite; }
@keyframes faceBreathe{
  0%, 100%{ transform:translateY(0) scale(1) rotate(0deg); }
  50%{ transform:translateY(-2px) scale(1.025) rotate(1deg); }
}

.face-glow{
  position:absolute;
  inset:-10px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(217,146,19,.22), transparent 70%);
  filter:blur(5px);
  opacity:.15;
  transition:opacity .5s ease;
}

.face-wrap.waiting .face-glow{ animation:faceGlowBreathe 3.4s ease-in-out infinite; }
@keyframes faceGlowBreathe{
  0%, 100%{ opacity:.12; }
  50%{ opacity:.26; }
}

.face-svg{ width:88px; height:88px; overflow:visible; }

.face-outline-outer{
  fill:none;
  stroke:rgba(7,27,60,.22);
  stroke-width:1;
}

.face-outline{
  fill:none;
  stroke:url(#faceGoldGrad);
  stroke-width:2.2;
}

.face-shine{
  position:absolute;
  inset:0;
  border-radius:50%;
  overflow:hidden;
  pointer-events:none;
}

.face-shine::after{
  content:'';
  position:absolute;
  top:-20%;
  left:-120%;
  width:60%;
  height:140%;
  background:linear-gradient(115deg, transparent, rgba(217,146,19,.55), transparent);
  transform:skewX(-18deg);
}

.face-shine.fire::after{ animation:faceSweep .85s ease-out; }
@keyframes faceSweep{
  0%{ left:-120%; }
  100%{ left:140%; }
}

.cheek{
  fill:var(--gold);
  opacity:0;
  transition:opacity .5s ease;
  filter:blur(1.2px);
}
.cheek.on{ opacity:.4; }

.brow{
  fill:none;
  stroke:var(--muted);
  stroke-width:2.1;
  stroke-linecap:round;
  opacity:0;
  transition:opacity .35s ease;
}

.eye-group{ transition:transform .28s ease; }

.eye{
  fill:var(--navy);
  transition:opacity .35s ease;
  transform-origin:center;
  transform-box:fill-box;
}

.eye-highlight{
  fill:rgba(255,255,255,.9);
  pointer-events:none;
}

.eye.blink-once{ animation:faceSingleBlink .5s ease-in-out; }
@keyframes faceSingleBlink{
  0%, 100%{ transform:scaleY(1); }
  45%{ transform:scaleY(.1); }
}

.eye.greet-blink{ animation:faceDoubleBlink .55s ease-in-out; }
@keyframes faceDoubleBlink{
  0%, 100%{ transform:scaleY(1); }
  22%, 62%{ transform:scaleY(.1); }
  42%, 82%{ transform:scaleY(1); }
}

.eye.happy{
  fill:none;
  stroke:var(--navy);
  stroke-width:2.3;
  stroke-linecap:round;
}

.mouth-path{
  fill:none;
  stroke:var(--navy);
  stroke-width:2.6;
  stroke-linecap:round;
}

.face-sparkle{
  position:absolute;
  opacity:0;
  transform:scale(.3);
  transition:opacity .5s ease, transform .5s cubic-bezier(.34,1.56,.64,1);
  color:var(--gold);
  font-size:10px;
}
.face-sparkle.on{ opacity:1; transform:scale(1); }
.face-sparkle.on.orbit{ animation:faceOrbit 5s linear infinite; }
@keyframes faceOrbit{
  from{ transform:rotate(0deg) translateX(0) rotate(0deg) scale(1); }
  to{ transform:rotate(360deg) translateX(0) rotate(-360deg) scale(1); }
}
.fs1{ top:-4px; left:2px; transform-origin:2px 36px; }
.fs2{ top:2px; right:-6px; transform-origin:-28px 28px; }
.fs3{ bottom:0; left:-8px; transform-origin:10px -28px; }
</style>
</head>

<body>

<svg width="0" height="0">
  <defs>
    <linearGradient id="faceGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcf55"/>
      <stop offset="100%" stop-color="#d99213"/>
    </linearGradient>

    <radialGradient id="faceDome" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f3f6fa"/>
      <stop offset="100%" stop-color="#e3e9f2"/>
    </radialGradient>

    <radialGradient id="faceRim" cx="32%" cy="26%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <filter id="faceDepth" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#061b3a" flood-opacity="0.28"/>
    </filter>
  </defs>
</svg>

<div class="app">

<section class="hero">

  <div class="google-mark">
    <div class="google-letter">G</div>
  </div>

  <h1 class="hero-title">
    LAISSEZ-NOUS VOTRE AVIS SUR GOOGLE
  </h1>

  <div class="hero-rating">
    <div class="rating-line"></div>

    <div class="hero-stars">
      <span class="hero-star">★</span>
      <span class="hero-star">★</span>
      <span class="hero-star">★</span>
      <span class="hero-star">★</span>
      <span class="hero-star">★</span>
    </div>

    <div class="rating-line right"></div>
  </div>

  <div class="wave-blue"></div>
  <div class="wave"></div>

</section>

<main class="content">

<section class="client-brand">

  <div class="logo-frame">

    <div
      class="client-logo"
      id="logo"
    >

      <div class="logo-ring-wrap">
        <div class="rating-ring idle" id="faceRing">
          <svg class="ring-svg" viewBox="0 0 140 140">
            <circle class="track" cx="70" cy="70" r="60" fill="none" stroke-width="6"/>
            <circle class="fill" id="faceRingFill" cx="70" cy="70" r="60" fill="none" stroke-width="6"/>
          </svg>
          <div class="face-tilt" id="faceTilt">
            <div class="face-wrap" id="faceWrap">
              <div class="face-glow"></div>
              <div class="face-shine" id="faceShine"></div>

              <span class="face-sparkle fs1" id="fsp1">✦</span>
              <span class="face-sparkle fs2" id="fsp2">✦</span>
              <span class="face-sparkle fs3" id="fsp3">✦</span>

              <svg class="face-svg" viewBox="0 0 76 76">
                <circle cx="38" cy="38" r="29" fill="url(#faceDome)"/>
                <circle cx="38" cy="38" r="29" fill="url(#faceRim)"/>
                <circle class="face-outline-outer" cx="38" cy="38" r="33"/>
                <circle class="face-outline" cx="38" cy="38" r="30" filter="url(#faceDepth)"/>

                <ellipse class="cheek" id="faceCheekL" cx="21" cy="42" rx="4.5" ry="3"/>
                <ellipse class="cheek" id="faceCheekR" cx="55" cy="42" rx="4.5" ry="3"/>

                <path class="brow" id="faceBrowL" d="M22 27 L30 30" filter="url(#faceDepth)"/>
                <path class="brow" id="faceBrowR" d="M54 27 L46 30" filter="url(#faceDepth)"/>

                <g class="eye-group" id="faceEyeLGroup" filter="url(#faceDepth)">
                  <circle class="eye" id="faceEyeLdot" cx="27" cy="33" r="2.6"/>
                  <circle class="eye-highlight" cx="28" cy="32" r="0.8"/>
                  <path class="eye happy" id="faceEyeLhappy" d="M23 33 Q27 28 31 33" style="opacity:0"/>
                </g>
                <g class="eye-group" id="faceEyeRGroup" filter="url(#faceDepth)">
                  <circle class="eye" id="faceEyeRdot" cx="49" cy="33" r="2.6"/>
                  <circle class="eye-highlight" cx="50" cy="32" r="0.8"/>
                  <path class="eye happy" id="faceEyeRhappy" d="M45 33 Q49 28 53 33" style="opacity:0"/>
                </g>

                <path class="mouth-path" id="faceMouthPath" d="M27 45 Q38 48 49 45" filter="url(#faceDepth)"/>
              </svg>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <h2
    class="business-name"
    id="businessName"
  >
    Chargement...
  </h2>

  <p
    class="subtitle"
    id="subtitle"
  >
    Chargement...
  </p>

</section>

<section
  id="feedbackArea"
  class="hidden feedback-area"
>

  <div class="rating-question">
    Comment avez-vous vécu votre expérience ?
  </div>

  <div
    class="stars"
    id="stars"
    role="radiogroup"
    aria-label="Évaluez votre expérience"
  >

    <button
      type="button"
      class="star"
      data-rating="1"
      aria-label="1 étoile"
    >★</button>

    <button
      type="button"
      class="star"
      data-rating="2"
      aria-label="2 étoiles"
    >★</button>

    <button
      type="button"
      class="star"
      data-rating="3"
      aria-label="3 étoiles"
    >★</button>

    <button
      type="button"
      class="star"
      data-rating="4"
      aria-label="4 étoiles"
    >★</button>

    <button
      type="button"
      class="star"
      data-rating="5"
      aria-label="5 étoiles"
    >★</button>

  </div>

  <div
    class="rating-text"
    id="ratingText"
  >
    Touchez une étoile pour commencer
  </div>

  <section
    class="message hidden"
    id="message"
  >

    <h2 id="messageTitle"></h2>

    <p id="messageText"></p>

    <div
      id="googleArea"
      class="hidden"
    >

      <a
        id="googleButton"
        class="button google"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        ⭐ Écrire mon avis sur Google
      </a>

    </div>

    <div
      id="privateArea"
      class="hidden"
    >

      <textarea
        id="feedbackMessage"
        placeholder="Dites-nous ce qui s'est passé ou comment nous pouvons nous améliorer..."
      ></textarea>

      <button
        type="button"
        id="sendPrivate"
        class="button private"
      >
        💬 Envoyer mon retour
      </button>

    </div>

  </section>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://ptfijeyhgmtcsedyiwto.supabase.co";

const SUPABASE_KEY =
"sb_publishable_gtihO7sbuhLIOG7ausRhXg_sYupQjXZ";


/* =========================================================
   CARD CODE
========================================================= */

function getCardCode(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("card");

}


/* =========================================================
   SUPABASE GET
========================================================= */

async function supabaseGet(endpoint){

  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/" +
      endpoint,
      {
        method:"GET",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY,
          "Content-Type":
            "application/json"
        }
      }
    );

  const text =
    await response.text();

  if(!response.ok){

    throw new Error(
      "Supabase HTTP " +
      response.status +
      ": " +
      text
    );

  }

  return text
    ? JSON.parse(text)
    : [];

}


/* =========================================================
   SCAN
========================================================= */

async function trackScan(cardCode){

  if(!cardCode){
    return;
  }

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/report_card_scan",
        {
          method:"POST",
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY,
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            p_card_code:cardCode
          })
        }
      );

    if(!response.ok){

      console.error(
        "Scan tracking failed:",
        await response.text()
      );

      return;

    }

    console.log(
      "Scan recorded:",
      cardCode
    );

  }catch(error){

    console.error(
      "Scan error:",
      error
    );

  }

}


/* =========================================================
   FINAL RATING
   ONLY CALLED WHEN USER SUBMITS.
========================================================= */

async function trackRating(
  cardCode,
  rating
){

  console.log(
    "FINAL RATING SUBMISSION:",
    rating
  );

  if(
    !cardCode ||
    !rating
  ){

    return false;

  }

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/report_card_rating",
        {
          method:"POST",
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY,
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            p_card_code:cardCode,
            p_rating:rating
          })
        }
      );

    if(!response.ok){

      console.error(
        "Rating tracking failed:",
        await response.text()
      );

      return false;

    }

    console.log(
      "FINAL RATING RECORDED:",
      rating
    );

    return true;

  }catch(error){

    console.error(
      "Rating error:",
      error
    );

    return false;

  }

}


/* =========================================================
   STATE
========================================================= */

let currentBusiness = null;
let selectedRating = null;


/* =========================================================
   LOAD CARD
========================================================= */

async function loadCard(){

  const cardCode =
    getCardCode();

  const businessName =
    document.getElementById(
      "businessName"
    );

  const subtitle =
    document.getElementById(
      "subtitle"
    );

  const feedbackArea =
    document.getElementById(
      "feedbackArea"
    );


  if(!cardCode){

    businessName.textContent =
      "Carte introuvable";

    subtitle.innerHTML =
      '<span class="error">Aucun code de carte fourni.</span>';

    return;

  }


  try{

    const cards =
      await supabaseGet(
        "cards?card_code=eq." +
        encodeURIComponent(cardCode) +
        "&active=eq.true&select=*"
      );


    if(!cards.length){

      throw new Error(
        "Card not found"
      );

    }


    const card =
      cards[0];


    const businesses =
      await supabaseGet(
        "businesses?id=eq." +
        encodeURIComponent(

        ) +
        "&select=*"
      );

/* =========================================================
   ELEMENTS
========================================================= */

const stars =
  document.querySelectorAll(
    ".star"
  );

const ratingText =

    "ratingText"
  );

const message =

  );

  );

  );

const privateArea =

  );

const feedbackMessage =

    "feedbackMessage"
  );

  document.getElementById(

  );

const googleButton =
  document.getElementById(

  );


/* =========================================================
   STAR CLICK
   NO DATABASE CALL.
========================================================= */

stars.forEach(
  star => {

    star.addEventListener(

      function(){

        const rating =

        message

          messageText.textContent =

          googleArea
            .classList
            .add("hidden");

          privateArea
            .classList
            .remove("hidden");

        }else{

          privateArea
            .classList
            .add("hidden");

          googleArea
            .classList
            .remove("hidden");


          if(
            selectedRating === 3
          ){

            messageTitle.textContent =
              "Merci pour votre retour !";

          }else if(
            selectedRating === 4
          ){

            messageTitle.textContent =
              "Nous sommes ravis !";

          }else{

            messageTitle.textContent =
              "Merci ! Nous sommes ravis que vous ayez adoré ! ❤️";

          }


          messageText.textContent =
            "Votre avis peut aider d'autres clients. Nous apprécierions beaucoup votre avis sur Google.";

        }

      }
    );

  }
);


/* =========================================================
   WHATSAPP SUBMISSION
========================================================= */

sendPrivate.addEventListener(

  async function(){

    if(

    ){

      alert(
        "Veuillez sélectionner 1 ou 2 étoiles."

/* =========================================================

googleButton.addEventListener(

<script>

/* =========================================================
   INTERACTIVE RATING FACE — replaces the static logo/photo.
   Purely additive: reacts to the existing .star buttons above,
   never touches their original click behavior.
========================================================= */

const faceRing = document.getElementById("faceRing");
const faceRingFill = document.getElementById("faceRingFill");
const faceTilt = document.getElementById("faceTilt");
const faceWrap = document.getElementById("faceWrap");
const faceShine = document.getElementById("faceShine");
const faceBrowL = document.getElementById("faceBrowL");
const faceBrowR = document.getElementById("faceBrowR");
const faceEyeLGroup = document.getElementById("faceEyeLGroup");
const faceEyeRGroup = document.getElementById("faceEyeRGroup");
const faceEyeLdot = document.getElementById("faceEyeLdot");
const faceEyeRdot = document.getElementById("faceEyeRdot");
const faceEyeLhappy = document.getElementById("faceEyeLhappy");
const faceEyeRhappy = document.getElementById("faceEyeRhappy");
const faceCheekL = document.getElementById("faceCheekL");
const faceCheekR = document.getElementById("faceCheekR");
const faceMouthPath = document.getElementById("faceMouthPath");
const faceSparkles = [
  document.getElementById("fsp1"),
  document.getElementById("fsp2"),
  document.getElementById("fsp3")
];

const FACE_CIRCUM = 377;
let faceSelected = null;
let faceEyesCanBlink = true;
let facePreviewDx = 0;
let facePointerDx = 0;
let facePointerDy = 0;

const faceMouthShapes = {
  0: { s:[27,45], c:[38,48], e:[49,45] },
  1: { s:[26,50], c:[38,40], e:[50,50] },
  2: { s:[26,47], c:[38,42], e:[50,47] },
  3: { s:[27,45], c:[38,46], e:[49,45] },
  4: { s:[26,42], c:[38,50], e:[50,42] },
  5: { s:[25,41], c:[38,53], e:[51,41] }
};

let faceCurrentMouth = { s:[...faceMouthShapes[0].s], c:[...faceMouthShapes[0].c], e:[...faceMouthShapes[0].e] };
let faceMouthAnimFrame = null;

function faceMouthToD(shape){
  return "M" + shape.s[0] + " " + shape.s[1] +
    " Q" + shape.c[0] + " " + shape.c[1] + " " + shape.e[0] + " " + shape.e[1];
}

function faceLerp(a, b, t){ return a + (b - a) * t; }
function faceEaseOutCubic(t){ return 1 - Math.pow(1 - t, 3); }

function faceTweenMouth(targetKey, duration){
  const target = faceMouthShapes[targetKey];
  const from = { s:[...faceCurrentMouth.s], c:[...faceCurrentMouth.c], e:[...faceCurrentMouth.e] };
  const start = performance.now();

  if(faceMouthAnimFrame){ cancelAnimationFrame(faceMouthAnimFrame); }

  function frame(now){
    const t = Math.min(1, (now - start) / duration);
    const eased = faceEaseOutCubic(t);

    faceCurrentMouth = {
      s: [ faceLerp(from.s[0], target.s[0], eased), faceLerp(from.s[1], target.s[1], eased) ],
      c: [ faceLerp(from.c[0], target.c[0], eased), faceLerp(from.c[1], target.c[1], eased) ],
      e: [ faceLerp(from.e[0], target.e[0], eased), faceLerp(from.e[1], target.e[1], eased) ]
    };

    faceMouthPath.setAttribute("d", faceMouthToD(faceCurrentMouth));

    if(t < 1){
      faceMouthAnimFrame = requestAnimationFrame(frame);
    } else {
      faceMouthAnimFrame = null;
    }
  }

  faceMouthAnimFrame = requestAnimationFrame(frame);
}

function updateFaceEyeTransform(){
  const tx = facePreviewDx + facePointerDx;
  const ty = facePointerDy;
  const t = "translate(" + tx + "px, " + ty + "px)";
  faceEyeLGroup.style.transform = t;
  faceEyeRGroup.style.transform = t;
}

function setFaceExpression(value, skipPop){
  faceTweenMouth(value, skipPop ? 0 : 420);

  facePreviewDx = 0;
  updateFaceEyeTransform();

  const showBrows = value === 1;
  faceBrowL.style.opacity = showBrows ? 1 : 0;
  faceBrowR.style.opacity = showBrows ? 1 : 0;

  const happy = value >= 4;
  faceEyeLdot.style.opacity = happy ? 0 : 1;
  faceEyeRdot.style.opacity = happy ? 0 : 1;
  faceEyeLhappy.style.opacity = happy ? 1 : 0;
  faceEyeRhappy.style.opacity = happy ? 1 : 0;
  faceEyesCanBlink = !happy;

  faceCheekL.classList.toggle("on", happy);
  faceCheekR.classList.toggle("on", happy);

  faceSparkles.forEach(s => s.classList.toggle("on", value === 5));
  faceSparkles.forEach(s => s.classList.toggle("orbit", value === 5));

  if(value === 5){
    faceShine.classList.remove("fire");
    void faceShine.offsetWidth;
    faceShine.classList.add("fire");
  }

  if(!skipPop){
    faceWrap.classList.remove("pop");
    void faceWrap.offsetWidth;
    faceWrap.classList.add("pop");
  }
}

function reactToRating(value){
  faceSelected = value;
  faceRing.classList.remove("idle");
  faceWrap.classList.remove("waiting");
  faceWrap.classList.add("shown");
  setFaceExpression(value);

  const offset = FACE_CIRCUM - (FACE_CIRCUM * (value / 5));
  faceRingFill.style.strokeDashoffset = offset;
}

function previewFaceMood(value){
  if(faceSelected !== null){ return; }
  faceTweenMouth(value, 220);
  facePreviewDx = (value - 3) * 1.4;
  updateFaceEyeTransform();
}

function clearFacePreview(){
  if(faceSelected !== null){ return; }
  faceTweenMouth(0, 220);
  facePreviewDx = 0;
  updateFaceEyeTransform();
}

/* hover preview on the real star buttons, without touching their existing behavior */
stars.forEach(star => {
  const value = Number(star.dataset.rating);
  star.addEventListener("mouseenter", () => previewFaceMood(value));
  star.addEventListener("mouseleave", () => clearFacePreview());
});

/* subtle 3D tilt + dynamic relighting, scoped to the face only */
const faceDome = document.getElementById("faceDome");
const faceRim = document.getElementById("faceRim");

faceRing.addEventListener("pointermove", (e) => {
  const rect = faceRing.getBoundingClientRect();
  const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  const ny = ((e.clientY - rect.top) / rect.height) * 2 - 1;

  const tiltMax = 14;
  faceTilt.style.transform =
    "rotateX(" + (-ny * tiltMax).toFixed(2) + "deg) rotateY(" + (nx * tiltMax).toFixed(2) + "deg)";

  facePointerDx = Math.max(-2, Math.min(2, nx * 2));
  facePointerDy = Math.max(-1.5, Math.min(1.5, ny * 1.5));
  updateFaceEyeTransform();

  if(faceDome && faceRim){
    const lightX = 35 + nx * 14;
    const lightY = 30 + ny * 14;
    faceDome.setAttribute("cx", lightX + "%");
    faceDome.setAttribute("cy", lightY + "%");
    faceRim.setAttribute("cx", lightX + "%");
    faceRim.setAttribute("cy", lightY + "%");
  }
});

faceRing.addEventListener("pointerleave", () => {
  faceTilt.style.transform = "rotateX(0deg) rotateY(0deg)";
  facePointerDx = 0;
  facePointerDy = 0;
  updateFaceEyeTransform();

  if(faceDome && faceRim){
    faceDome.setAttribute("cx", "35%");
    faceDome.setAttribute("cy", "30%");
    faceRim.setAttribute("cx", "32%");
    faceRim.setAttribute("cy", "26%");
  }
});

/* greeting sequence on page load */
function faceGreet(){
  faceWrap.classList.add("shown");
  setFaceExpression(0, true);
  faceWrap.classList.add("greet");

  faceWrap.addEventListener("animationend", function onDone(){
    faceWrap.classList.remove("greet");
    faceWrap.removeEventListener("animationend", onDone);

    faceEyeLdot.classList.add("greet-blink");
    faceEyeRdot.classList.add("greet-blink");

    setTimeout(() => {
      faceEyeLdot.classList.remove("greet-blink");
      faceEyeRdot.classList.remove("greet-blink");
      faceWrap.classList.add("waiting");
    }, 600);
  }, { once:true });
}

faceGreet();

/* natural, randomized blinking */
function scheduleFaceBlink(){
  const delay = 2400 + Math.random() * 3200;
  setTimeout(() => {
    if(faceEyesCanBlink){
      faceEyeLdot.classList.remove("blink-once");
      faceEyeRdot.classList.remove("blink-once");
      void faceEyeLdot.offsetWidth;
      faceEyeLdot.classList.add("blink-once");
      faceEyeRdot.classList.add("blink-once");
    }
    scheduleFaceBlink();
  }, delay);
}

scheduleFaceBlink();

</script>
